# Local development backing services: Postgres, object storage and Redis.
#
# Exists so day-to-day work — running migrations, breaking things, resetting —
# never touches the Neon instance. Neon is where real user data lives; a dev
# loop that writes test analyses and half-finished profiles into it makes the
# production dataset progressively less trustworthy and the free tier's storage
# quota meaningless.
#
# Uses the pgvector image rather than plain postgres so embeddings (semantic CV
# and job-description matching) can be developed locally without swapping the
# container later. Neon supports pgvector too, so the two stay at parity.

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: align-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: align
      POSTGRES_PASSWORD: align
      POSTGRES_DB: align
    ports:
      # 5433 on the host, not 5432: a machine that already runs a local Postgres
      # would otherwise fail to bind, or worse, silently connect you to the
      # wrong server. The container still listens on 5432 internally.
      - '5433:5432'
    volumes:
      - align-pgdata:/var/lib/postgresql/data
      # Runs once, only when the data volume is first created.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `npm run db:up` waits on this, so migrations never race the server's
      # startup — Postgres briefly accepts connections before it is truly ready.
      test: ['CMD-SHELL', 'pg_isready -U align -d align']
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO stands in for Cloudflare R2. Both speak S3, so the application code is
  # identical against either — only the endpoint, region and path-style flag in
  # .env.local differ. Same reasoning as the database above: a dev loop that
  # writes test CVs and half-finished avatars into the real R2 buckets fills
  # production with junk PII that nobody will ever go back and clean out.
  minio:
    image: minio/minio:latest
    container_name: align-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      MINIO_API_CORS_ALLOW_CREDENTIALS_WITH_WILDCARD: 'off'
    ports:
      # 9000 is the S3 API (what the app and presigned URLs talk to), 9001 is the
      # web console — browse buckets at http://localhost:9001 with the
      # credentials above when you want to see what actually got written.
      - '9000:9000'
      - '9001:9001'
    volumes:
      - align-miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the three buckets and exits. Buckets are not namespaces MinIO invents
  # on demand — an upload to a missing bucket fails — so this has to run before
  # the app does. Named the same as the R2 buckets so keys and paths stay
  # identical between local and production.
  minio-init:
    image: minio/mc:latest
    container_name: align-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # `mb --ignore-existing` makes this idempotent, so it is safe on every up.
    # The avatars bucket gets an anonymous-download policy because User.image
    # holds a direct URL the browser fetches without credentials — the other two
    # stay private and are only ever reachable through a presigned URL.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/align-cv-uploads &&
      mc mb --ignore-existing local/align-cv-rewrites &&
      mc mb --ignore-existing local/align-users &&
      mc anonymous set download local/align-users
      "

  # Redis backs the Job Board cache: provider results, merged search pages,
  # search sessions and refresh locks. It holds nothing durable — every key is
  # reconstructable by re-querying the providers, and losing all of them costs
  # latency and nothing else (see src/shared/lib/cache/cache-store.ts).
  #
  # It exists as a container for the same reason the database does: the
  # deployment target is serverless, so the module-level Maps this replaces were
  # per-lambda-instance and vanished on every cold start and scale-out. A local
  # Redis is the only way to develop and test cross-instance behaviour —
  # refresh-lock contention, shared sessions, stale-while-revalidate — at all.
  redis:
    image: redis:7-alpine
    container_name: align-redis
    restart: unless-stopped
    # Append-only persistence so a restart does not silently empty the cache
    # mid-session. The DATA is still disposable; this only keeps the local dev
    # loop from looking like a cache bug every time the container bounces.
    command: redis-server --appendonly yes
    ports:
      # 6379 is the default and there is no collision risk worth the confusion of
      # remapping it — unlike Postgres, a stray local Redis holding job-search
      # cache entries is harmless.
      - '6379:6379'
    volumes:
      - align-redisdata:/data
    healthcheck:
      # `npm run redis:up` waits on this, so the first search after a cold start
      # does not race the server accepting connections.
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  align-pgdata:
  align-miniodata:
  align-redisdata:
